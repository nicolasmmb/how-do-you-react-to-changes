<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 585" width="380" height="585" role="img" aria-label="Kübler-Ross stages of change: Denial, Anger, Bargaining, Depression, Acceptance">
  <style>
    .box   { fill:#4a7fbe; }
    .label { fill:#ffffff;
             font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-weight:600; font-size:40px; }
  </style>

  <rect class="box" x="10" y="10"  width="360" height="95" rx="16"/>
  <rect class="box" x="10" y="125" width="360" height="95" rx="16"/>
  <rect class="box" x="10" y="240" width="360" height="95" rx="16"/>
  <rect class="box" x="10" y="355" width="360" height="95" rx="16"/>
  <rect class="box" x="10" y="470" width="360" height="95" rx="16"/>

  <text class="label" x="30" y="72">1. Denial</text>
  <text class="label" x="30" y="187">2. Anger</text>
  <text class="label" x="30" y="302">3. Bargaining</text>
  <text class="label" x="30" y="417">4. Depression</text>
  <text class="label" x="30" y="532">5. Acceptance</text>
</svg>
